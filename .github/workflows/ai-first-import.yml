name: AI-first import checks
on:
  pull_request:
    paths:
      - 'smart-import.js'
      - 'index.html'
      - 'personal.js'
      - 'api/import-mapping.mjs'
      - 'api/import-mapping.test.mjs'
      - 'api/minimal-import.test.mjs'
      - '.github/workflows/ai-first-import.yml'
  workflow_dispatch:

jobs:
  test-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate import source syntax
        run: |
          node --check smart-import.js
          node --check personal.js
          node --check api/import-mapping.mjs
          node --check api/import-mapping.test.mjs
      - name: Run import and financial safety tests
        run: node --experimental-sqlite --test api/import-mapping.test.mjs api/minimal-import.test.mjs api/financial-auto.test.mjs
