name: Website account checks
on:
  pull_request:
    paths:
      - 'api/**'
      - 'bot/**'
      - 'web-access.js'
      - 'personal.js'
      - 'payments.js'
      - 'index.html'
      - 'landing.html'
      - 'deploy/release.sh'
      - '.github/workflows/test-website-login.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'bot/**'
      - 'web-access.js'
      - 'personal.js'
      - 'payments.js'
      - 'index.html'
      - 'landing.html'
      - '.github/workflows/test-website-login.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check web-access.js
          node --check bot/index.mjs
          node --check bot/controls.mjs
          node --check api/private-workspace.test.mjs
          node --check personal.js
          node --check payments.js
          node --check api/server.mjs
          node --check api/account-link.mjs
          node --check api/website-accounts.mjs
          node --check api/website-selfservice.mjs
          node --check api/auth-mail.mjs
          node --check api/smtp-mail.mjs
      - name: Run access, billing and payment tests
        run: node --experimental-sqlite --test api/accumulate.test.mjs bot/digest.test.mjs bot/controls.test.mjs api/account-link.test.mjs api/private-workspace.test.mjs api/website-accounts.test.mjs api/website-selfservice.test.mjs api/auth-mail.test.mjs api/smtp-mail.test.mjs api/web-login.test.mjs api/company-access.test.mjs api/billing.test.mjs api/yookassa.test.mjs
