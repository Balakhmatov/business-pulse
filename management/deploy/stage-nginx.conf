# Add these locations INSIDE the EXISTING HTTPS server block for stage.cityai.site.
# This is a snippet, not a separate server block or a complete Nginx config.
location = /businesspulse {
    return 308 /businesspulse/;
}
location ^~ /businesspulse/ {
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:3129;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
}
